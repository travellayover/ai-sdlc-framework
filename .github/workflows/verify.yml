name: verify

on:
  push:
    branches: [master, lane/**]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run verify (typecheck + lint + tests)
        run: npm run verify

      - name: Self-audit (run framework against itself)
        run: |
          npx tsx src/cli.ts init --target .
          npx tsx src/cli.ts run --target . --output .ai-sdlc-report
        continue-on-error: true

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log
          path: audit/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload framework report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-report
          path: .ai-sdlc-report/
          if-no-files-found: ignore
          retention-days: 30
